<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href ="style.css">
    <title>Document</title>
</head>
<body>
    <div class="form-card">
    <form class="form-left" id="profileForm">
        <h1>Accessible Form UI</h1>
        
        <div class="input-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="What should we call you?" aria-required="true">
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@doe.com" aria-required="true">
            <span class="error-msg" id="emailError" aria-live="polite"></span>
        </div>

        <div class="input-group">
            <label for="password">Enter Password</label>
            <div class="pass-wrapper">
                <input type="password" id="password" placeholder="********">
                <button type="button" class="toggle-pass" aria-label="Toggle password visibility">👁️</button>
            </div>
        </div>

        <div class="input-group">
            <label for="confirmPass">Confirm Password</label>
            <div class="pass-wrapper">
                <input type="password" id="confirmPass" placeholder="********">
                <button type="button" class="toggle-pass" aria-label="Toggle password visibility">👁️</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">Update Profile</button>
    </form>

    <div class="form-right">
        <div class="progress-circle">
            <svg width="120" height="120">
                <circle cx="60" cy="60" r="50" class="bg-circle"></circle>
                <circle cx="60" cy="60" r="50" class="fg-circle" id="progressRing"></circle>
            </svg>
            <span id="percentText">0%</span>
        </div>
        <p>Profile Completeness</p>
        
        <ul class="checklist">
            <li id="check-name">Create Account</li>
            <li id="check-email">Update Roadmap Progress</li>
            <li id="check-setup">Setup Public Profile</li>
            <li id="check-project">Complete your first project</li>
        </ul>
    </div>
</div>
</body>
<script  src="script.js"></script>
</html>
